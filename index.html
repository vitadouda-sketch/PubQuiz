<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pub Quiz Realtime System</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { --bg: #121214; --card: #1e1e24; --accent: #ff9f1c; --green: #2ec4b6; --red: #e74c3c; --text: #fff; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 1rem; }
    .container { width: 100%; max-width: 650px; background: var(--card); padding: 1.5rem; border-radius: 12px; }
    h1, h2, h3 { color: var(--accent); margin-bottom: 1rem; text-align: center; }
    input, button { width: 100%; padding: 0.8rem; margin: 0.4rem 0; border-radius: 8px; border: 1px solid #444; font-size: 1rem; }
    input { background: #000; color: #fff; }
    button { background: var(--accent); color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 1rem; }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }
    .opt-btn { background: #2b2b36; color: #fff; text-align: left; border: 2px solid #444; margin: 0.4rem 0; }
    .opt-btn.selected { border-color: var(--accent); background: #3b3b4a; }
    .status-badge { text-align: center; padding: 0.5rem; background: #333; border-radius: 6px; margin-bottom: 1rem; font-weight: bold; }
    .hidden { display: none !important; }
    
    .players-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.5rem; }
    .players-grid input { margin: 0; font-size: 0.9rem; }
    .section-label { font-size: 0.9rem; color: #aaa; margin-top: 1rem; display: block; }

    /* TÝMY A TLAČÍTKO SMAZAT */
    .team-item { display: flex; justify-content: space-between; align-items: center; background: #121214; padding: 0.6rem; margin: 0.4rem 0; border-radius: 6px; }
    .btn-kick { background: var(--red); color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer; margin: 0; width: auto; }

    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.8rem; text-align: left; border-bottom: 1px solid #333; }
    th { color: var(--accent); }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 1. REGISTRACE HRÁČE (MOBIL) -->
  <div id="view-register" class="hidden">
    <h1>📱 Připojení do Kvízu</h1>
    
    <label class="section-label">Název týmu *</label>
    <input type="text" id="reg-team-name" placeholder="např. Šampioni z Mostu">

    <label class="section-label">Členové týmu (až 8 hráčů):</label>
    <div class="players-grid">
      <input type="text" class="player-input" placeholder="Hráč 1">
      <input type="text" class="player-input" placeholder="Hráč 2">
      <input type="text" class="player-input" placeholder="Hráč 3">
      <input type="text" class="player-input" placeholder="Hráč 4">
      <input type="text" class="player-input" placeholder="Hráč 5">
      <input type="text" class="player-input" placeholder="Hráč 6">
      <input type="text" class="player-input" placeholder="Hráč 7">
      <input type="text" class="player-input" placeholder="Hráč 8">
    </div>

    <button onclick="registerTeam()">VSTOUPIT DO HRY</button>
  </div>

  <!-- 2. HRÁČSKÉ ROZHRANÍ (MOBIL) -->
  <div id="view-player" class="hidden">
    <div class="status-badge" id="player-team-title">Tým: -</div>
    <div id="player-status-msg" style="text-align:center; margin: 2rem 0; color: #aaa;">
      ⏳ Čekejte na spuštění otázky pořadatelem...
    </div>
    
    <div id="player-question-box" class="hidden">
      <h3 id="player-q-text" style="margin-bottom:1rem;">-</h3>
      <div id="player-options"></div>
      <button id="player-submit-btn" disabled onclick="submitPlayerAnswer()" style="background: var(--green);">POTVRDIT ODPOVĚĎ</button>
    </div>
  </div>

  <!-- 3. OBRAZOVKA PRO POŘADATELE / TV -->
  <div id="view-host" class="hidden">
    <h2>🎤 Řídicí Panel / TV Projekce</h2>
    
    <div id="host-setup" style="text-align: center;">
      <p style="margin-bottom:1rem;">Naskenujte QR kód a připojte se do hry:</p>
      <div id="qrcode" style="display:flex; justify-content:center; margin-bottom:1rem;"></div>
      
      <h3>Připojené týmy:</h3>
      <div id="connected-teams-list" style="text-align:left; margin:1rem 0;"></div>
      
      <button onclick="startNextQuestionHost()">SPUSTIT 1. OTÁZKU ►</button>
    </div>

    <div id="host-game" class="hidden">
      <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
        <span id="host-cat-num" style="color:var(--accent); font-weight:bold;">-</span>
        <span id="host-votes-count" style="color:var(--green); font-weight:bold;">Odhlasováno: 0 / 0</span>
      </div>
      <h2 id="host-q-text" style="font-size:1.8rem; margin:1rem 0;">-</h2>

      <div id="host-results-box" class="hidden">
        <h3 style="color:var(--green);">Správná odpověď: <span id="host-correct-ans"></span></h3>
        <h3 style="margin-top:1.5rem;">Průběžné Pořadí:</h3>
        <table>
          <thead><tr><th>#</th><th>Tým</th><th>Body</th></tr></thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>

      <div style="margin-top:2rem; display:flex; gap:0.5rem;">
        <button onclick="revealResultsHost()" style="background:var(--green);">VYHODNOTIT OTÁZKU</button>
        <button onclick="startNextQuestionHost()">DALŠÍ OTÁZKA ►</button>
      </div>
      
      <!-- SEZNAM TÝMŮ I S MOŽNOSTÍ SMAZÁNÍ BĚHEM HRY -->
      <div style="margin-top: 2rem; text-align: left;">
        <h4 style="color:#aaa;">Správa týmů (Kick/Smazat):</h4>
        <div id="connected-teams-game-list"></div>
      </div>
    </div>
  </div>

</div>

<script>
  const firebaseConfig = {
    databaseURL: "https://muj-kviz-6e835-default-rtdb.europe-west1.firebasedatabase.app"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // 55 OTÁZEK
  const questions = [
    // --- SCI-FI (11) ---
    { cat: "Sci-Fi", q: "Z jakého materiálu je tělo mimozemšťana Rockyho v románu Projekt Spasitel?", opts: ["Ocel", "Titan", "Uhlík", "Křemík"], correct: 1 },
    { cat: "Sci-Fi", q: "V románu Duna od Franka Herberta je planeta Arrakis jediným zdrojem koreření. Který tvor je klíčový pro jeho vznik?", opts: ["Písečný červ", "Obří škorpión", "Pouštní liška", "Létající ještěr"], correct: 0 },
    { cat: "Sci-Fi", q: "Ve Stopařově průvodci po Galaxii se počítala odpověď na otázku života, vesmíru a vůbec. Jak se jmenoval superpočítač?", opts: ["HAL 9000", "Hlubina Mysli (Deep Thought)", "Skynet", "Multivac"], correct: 1 },
    { cat: "Sci-Fi", q: "Která planeta byla zničena první Hvězdou smrti ve filmu Star Wars: Epizoda IV?", opts: ["Tatooine", "Alderaan", "Endor", "Coruscant"], correct: 1 },
    { cat: "Sci-Fi", q: "Jaký test se ve filmu Blade Runner používá k odhalení replikantů měřením reakcí zornic?", opts: ["Turingův test", "Voight-Kampffův test", "Voight-Rassmussenův test", "Deckardův test"], correct: 1 },
    { cat: "Sci-Fi", q: "Jak se jmenuje loď hlavních hrdinů pod vedením Jamese Holdena ve sérii The Expanse?", opts: ["Canterbury", "Rocinante", "Enterprise", "Serenity"], correct: 1 },
    { cat: "Sci-Fi", q: "Jak se jmenuje mikroskopický organismus v Projektu Spasitel, který pohlcuje energii Slunce?", opts: ["Astrofág", "Chrono-vir", "Solaris", "Proton"], correct: 0 },
    { cat: "Sci-Fi", q: "Kdo napsal klasický sci-fi román Já, robot a formuloval Tři zákony robotiky?", opts: ["Arthur C. Clarke", "Isaac Asimov", "Philip K. Dick", "Stanisław Lem"], correct: 1 },
    { cat: "Sci-Fi", q: "Jaký pojem označuje anonymního člena výsadku v červené uniformě ve Star Treku, který obvykle zemře?", opts: ["Redshirt", "Rookie", "Vanguard", "Cannon Fodder"], correct: 0 },
    { cat: "Sci-Fi", q: "Jak se v románu Duna nazývá obří tajný řád ženských adeptek?", opts: ["Bene Gesserit", "Bene Tleilax", "Sardaukar", "Honored Matres"], correct: 0 },
    { cat: "Sci-Fi", q: "Jaký předmět je podle Stopařova průvodce po Galaxii tím nejpotřebnějším pro každého stopaře?", opts: ["Ručník", "Astro-kompas", "Laserový klíč", "Babel rybka"], correct: 0 },

    // --- SPORT (11) ---
    { cat: "Sport", q: "Který argentinský fotbalista vstřelil na MS 1986 proti Anglii gól označený jako 'Ruka Boží'?", opts: ["Pelé", "Diego Maradona", "Johan Cruyff", "Lionel Messi"], correct: 1 },
    { cat: "Sport", q: "Který kanadský hokejista s přezdívkou 'The Great One' drží rekord v počtu bodů v NHL (2 857 bodů)?", opts: ["Mario Lemieux", "Wayne Gretzky", "Sidney Crosby", "Bobby Orr"], correct: 1 },
    { cat: "Sport", q: "Jak se jmenuje bizarní sport kombinující střídání kol deskové hry na šachovnici a souboje v ringu?", opts: ["Šachový box", "Ring šach", "Kombat Mat", "Punch Chess"], correct: 0 },
    { cat: "Sport", q: "Jaký je nejvyšší možný nához, kterého může hráč šipek dosáhnout v jednom kole 3 šipkami?", opts: ["150", "180", "200", "300"], correct: 1 },
    { cat: "Sport", q: "Ve kterém motorsportovém odvětví získal Michael Schumacher celkem 7 titulů mistra světa?", opts: ["MotoGP", "Formule 1", "Rallye WRC", "NASCAR"], correct: 1 },
    { cat: "Sport", q: "Jak se nazývá bizarní anglická soutěž na kopci Cooper's Hill, kde se běhá ze strmého svahu za běžícím objektu?", opts: ["Koulení sýra", "Hod barelem", "Běh s manželkou", "Skok do bláta"], correct: 0 },
    { cat: "Sport", q: "Který český hokejový útočník vyhrál v Naganu 1998 zlato a v NHL nastřílel přes 700 gólů?", opts: ["Patrik Eliáš", "Jaromír Jágr", "Martin Ručinský", "Milan Hejduk"], correct: 1 },
    { cat: "Sport", q: "Jak se jmenuje nejprestižnější individuální fotbalové ocenění pořádané časopisem France Football?", opts: ["Zlatý míč", "Zlatá kopačka", "FIFA World Player", "UEFA Cup"], correct: 0 },
    { cat: "Sport", q: "Jaká je přesná vzdálenost od odhodové čáry k terči u oficiálních soutěžních šipek?", opts: ["2,15 m", "2,37 m", "2,50 m", "3,00 m"], correct: 1 },
    { cat: "Sport", q: "Který brazilský fotbalista je jako jediný hráč v historii držitelem tří titulů mistra světa (1958, 1962, 1970)?", opts: ["Ronaldo", "Pelé", "Romário", "Ronaldinho"], correct: 1 },
    { cat: "Sport", q: "Který zimní sport spočívá v sjíždění ledového koryta na velmi malých saních hlavou napřed?", opts: ["Boby", "Skeleton", "Sáně", "Curling"], correct: 1 },

    // --- VIDEOHRY (11) ---
    { cat: "Videohry", q: "Jak se jmenuje syn Grommashe Hellscreama, který vedl Železnou hordu ve datadisku Warlords of Draenor?", opts: ["Thrall", "Garrosh Hellscream", "Varok Saurfang", "Durotan"], correct: 1 },
    { cat: "Videohry", q: "Ve hře League of Legends (LoL) se hlavní herní mapa pro zápasy 5v5 nazývá:", opts: ["Howling Abyss", "Summoner's Rift", "Twisted Treeline", "Crystal Scar"], correct: 1 },
    { cat: "Videohry", q: "Který z Pánů Pekla je hlavním titulním záporákem v 1. a 2. díle série Diablo?", opts: ["Mephisto", "Diablo", "Baal", "Belial"], correct: 1 },
    { cat: "Videohry", q: "Ve strategické sérii StarCraft vystupují 3 rasy: Terrani, Protoss a biologický roj. Jak se tento roj nazývá?", opts: ["Zerg", "Borg", "Tyranid", "Flood"], correct: 0 },
    { cat: "Videohry", q: "Ve hře GTA: San Andreas ovládá hlavní hrdina CJ pouliční gang sídlící v ulici Grove Street. Jak se tento gang jmenuje?", opts: ["Ballas", "Grove Street Families", "Vagos", "Triads"], correct: 1 },
    { cat: "Videohry", q: "Jak se jmenuje meč paladina Arthase ze hry Warcraft III, který ho proměnil v Lich Kinga?", opts: ["Ashbringer", "Frostmourne", "Shadowmourne", "Thunderfury"], correct: 1 },
    { cat: "Videohry", q: "Ve hře Diablo II se v tajné úrovni (Secret Level) vytvořené v kostce s Wirtovou nohou vyskytují jaká stvoření?", opts: ["Bojové krávy", "Prasata s meči", "Kostlivci", "Draci"], correct: 0 },
    { cat: "Videohry", q: "Která ze šampionek v League of Legends je známa jako pirátská kapitánka s dvěma pistolemi z města Bilgewater?", opts: ["Sarah Fortune (Miss Fortune)", "Caitlyn", "Jinx", "Sivir"], correct: 0 },
    { cat: "Videohry", q: "Ve kterém fiktivním americkém státě se odehrává děj hry Grand Theft Auto V?", opts: ["Liberty City", "San Andreas", "Vice City", "Alderney"], correct: 1 },
    { cat: "Videohry", q: "Jak se v sérii StarCraft nazývá gigantický psionický organismus, který sloužil jako centrální mozek Zergů?", opts: ["Overmind", "Ultralisk", "Kerrigan", "Cerebrate"], correct: 0 },
    { cat: "Videohry", q: "V MMORPG World of Warcraft je hlavním městem lidské rasy a Aliance opevněné město:", opts: ["Orgrimmar", "Stormwind", "Ironforge", "Darnassus"], correct: 1 },

    // --- LÉK NEBO POKÉMON? (11) ---
    { cat: "Lék nebo Pokémon?", q: "Rozhodněte: Je ATARAX skutečný lék (sedativum), nebo Pokémon?", opts: ["Skutečný lék", "Pokémon"], correct: 0 },
    { cat: "Lék nebo Pokémon?", q: "Rozhodněte: Je RAYQUAZA skutečný lék, nebo Pokémon?", opts: ["Skutečný lék", "Pokémon"], correct: 1 },
    { cat: "Lék nebo Pokémon?", q: "Rozhodněte: Je FOONGUS skutečný lék, nebo Pokémon?", opts: ["Skutečný lék", "Pokémon"], correct: 1 },
    { cat: "Lék nebo Pokémon?", q: "Rozhodněte: Je ZOLOFT skutečný lék (antidepresivum), nebo Pokémon?", opts: ["Skutečný lék", "Pokémon"], correct: 0 },
    { cat: "Lék nebo Pokémon?", q: "Rozhodněte: Je PARAS skutečný lék, nebo Pokémon z 1. generace?", opts: ["Skutečný lék", "Pokémon"], correct: 1 },
    { cat: "Lék nebo Pokémon?", q: "Rozhodněte: Je VENTOLIN skutečný lék (bronchodilatační sprey), nebo Pokémon?", opts: ["Skutečný lék", "Pokémon"], correct: 0 },
    { cat: "Lék nebo Pokémon?", q: "Rozhodněte: Je MAGNEMITE skutečný lék, nebo Pokémon?", opts: ["Skutečný lék", "Pokémon"], correct: 1 },
    { cat: "Lék nebo Pokémon?", q: "Rozhodněte: Je AMOKSIKLAV skutečný lék (antibiotikum), nebo Pokémon?", opts: ["Skutečný lék", "Pokémon"], correct: 0 },
    { cat: "Lék nebo Pokémon?", q: "Rozhodněte: Je MAGBY skutečný lék, nebo Pokémon?", opts: ["Skutečný lék", "Pokémon"], correct: 1 },
    { cat: "Lék nebo Pokémon?", q: "Rozhodněte: Je CLARITINE skutečný lék (na alergie), nebo Pokémon?", opts: ["Skutečný lék", "Pokémon"], correct: 0 },
    { cat: "Lék nebo Pokémon?", q: "Rozhodněte: Je KECLEON skutečný lék, nebo Pokémon?", opts: ["Skutečný lék", "Pokémon"], correct: 1 },

    // --- FANTASY (11) ---
    { cat: "Fantasy", q: "V Úžasné Zeměploše od Terryho Pratchetta leží město Ankh-Morpork. Kdo je jeho obávaným i respektovaným Vládcem (Patricijem)?", opts: ["Lord Vetinari", "Mrakoplaš", "Nobby Nobbs", "Samuel Elánius"], correct: 0 },
    { cat: "Fantasy", q: "V sérii Zaklínač se Geralt učil zaklínačskému řemeslu na starobylé horské pevnosti Školy Vlka. Jak se jmenuje?", opts: ["Novigrad", "Kaer Morhen", "Vizima", "Oxenfurt"], correct: 1 },
    { cat: "Fantasy", q: "Ve světě Harryho Pottera vyučuje létání na koštěti a působí jako rozhodčí ve Quidditchi profesorka:", opts: ["Madam Hoochová", "Profesorka McGonagallová", "Madam Pomfreyová", "Profesorka Prýtová"], correct: 0 },
    { cat: "Fantasy", q: "V Pánovi prstenů tvoří Společenstvo Prstenu celkem 9 členů. Kolik z nich bylo zástupců rasy hobitů?", opts: ["2", "4", "6", "8"], correct: 1 },
    { cat: "Fantasy", q: "Jak se v Pratchettově Úžasné Zeměploše jmenuje Smrťův kůň, který je zcela živý a bílý?", opts: ["Vraník", "Trnka", "Blesk", "Smrťák"], correct: 1 },
    { cat: "Fantasy", q: "Ve světě Zaklínače se osudová dívka Ciri celým jménem nazývá Cirilla Fiona Elen Riannon. Ze kterého království pocházela?", opts: ["Temerie", "Cintra", "Redanie", "Aedirn"], correct: 1 },
    { cat: "Fantasy", q: "Které zakleté stvoření strážící vchod do podzemní říše Moria napadlo Společenstvo u brány?", opts: ["Balrog", "Vrtal ve vodě (Chobotnatec)", "Kraken", "Skřetí král"], correct: 1 },
    { cat: "Fantasy", q: "Která z Relikvií smrti ve světě Harryho Pottera dokáže přivést zpět stíny zemřelých?", opts: ["Bezbezová hůlka", "Kámen vzkříšení", "Neviditelný plášť", "Gryfondorův meč"], correct: 1 },
    { cat: "Fantasy", q: "Která čarodějka se známou vůní šeříku a angreštu je životní láskou zaklínače Geralta z Rivie?", opts: ["Triss Merigold", "Yennefer z Vengerbergu", "Fringilla Vigo", "Keira Metz"], correct: 1 },
    { cat: "Fantasy", q: "Jaké rasy je desátník Nobby Nobbs v Pratchettově Úžasné Zeměploše, u něhož musel Patricij vydat potvrzení, že je člověk?", opts: ["Goblini", "Člověk", "Troll", "Trpaslík"], correct: 1 },
    { cat: "Fantasy", q: "V trilogii Pán prstenů je Jediný prsten zničen vhodžením do ohně Hory osudu. Kdo nechtěným pádem do lávy způsobil jeho zkázu?", opts: ["Frodo Pytlík", "Glum (Smeagol)", "Samvěd Křepelka", "Sauron"], correct: 1 }
  ];

  let myTeamKey = localStorage.getItem('quiz_team_key');
  let selectedOption = null;
  let currentQIndex = -1;

  const currentUrl = window.location.href;
  const isHost = currentUrl.includes('mode=host');

  if (isHost) {
    document.getElementById('view-host').classList.remove('hidden');
    document.getElementById('view-register').classList.add('hidden');
    
    // RESET STAVU PŘI SPOŠTĚNÍ MODERÁTORA
    db.ref('gameState').set({ status: 'WAITING', qIndex: -1 });

    const joinUrl = currentUrl.split('?')[0];
    new QRCode(document.getElementById("qrcode"), { text: joinUrl, width: 160, height: 160 });
    listenHost();
  } else {
    // POKUD UŽ HRÁČ MÁ ULOŽENÝ KLÍČ (OBNOVENÍ STRÁNKY)
    if (myTeamKey) {
      db.ref(`teams/${myTeamKey}`).once('value', snapshot => {
        if (snapshot.exists()) {
          const tData = snapshot.val();
          document.getElementById('view-register').classList.add('hidden');
          document.getElementById('view-player').classList.remove('hidden');
          document.getElementById('player-team-title').innerText = `Tým: ${tData.name}`;
          listenPlayer();
        } else {
          // Pokud byl tým smazán moderátorem
          localStorage.removeItem('quiz_team_key');
          myTeamKey = null;
          document.getElementById('view-register').classList.remove('hidden');
        }
      });
    } else {
      document.getElementById('view-register').classList.remove('hidden');
    }
  }

  function registerTeam() {
    const name = document.getElementById('reg-team-name').value.trim();
    if (!name) return alert("Zadejte název týmu!");

    const playerInputs = document.querySelectorAll('.player-input');
    const playersList = [];
    playerInputs.forEach(input => {
      if (input.value.trim() !== "") playersList.push(input.value.trim());
    });

    const teamRef = db.ref('teams').push();
    myTeamKey = teamRef.key;
    
    // ULOŽENÍ KLÍČE DO PAMĚTI PROHLÍŽEČE
    localStorage.setItem('quiz_team_key', myTeamKey);

    teamRef.set({ 
      name: name, 
      players: playersList, 
      score: 0, 
      currentAnswer: null 
    }).then(() => {
      document.getElementById('view-register').classList.add('hidden');
      document.getElementById('view-player').classList.remove('hidden');
      document.getElementById('player-team-title').innerText = `Tým: ${name}`;
      listenPlayer();
    }).catch((error) => {
      alert("Chyba při zápisu do databáze: " + error.message);
    });
  }

  function listenPlayer() {
    db.ref('gameState').on('value', snapshot => {
      const state = snapshot.val();
      if (!state) return;

      if (state.status === 'QUESTION') {
        currentQIndex = state.qIndex;
        const qData = questions[currentQIndex];
        
        document.getElementById('player-status-msg').classList.add('hidden');
        document.getElementById('player-question-box').classList.remove('hidden');
        document.getElementById('player-q-text').innerText = qData.q;
        
        const optsContainer = document.getElementById('player-options');
        optsContainer.innerHTML = '';
        selectedOption = null;
        document.getElementById('player-submit-btn').disabled = true;
        document.getElementById('player-submit-btn').innerText = "POTVRDIT ODPOVĚĎ";

        qData.opts.forEach((opt, idx) => {
          optsContainer.innerHTML += `<button class="opt-btn" onclick="selectOpt(this, ${idx})">${opt}</button>`;
        });
      } else if (state.status === 'RESULTS') {
        document.getElementById('player-question-box').classList.add('hidden');
        document.getElementById('player-status-msg').classList.remove('hidden');
        document.getElementById('player-status-msg').innerHTML = " Vyhodnoceno! Podívejte se na projektor.";
      } else {
        document.getElementById('player-question-box').classList.add('hidden');
        document.getElementById('player-status-msg').classList.remove('hidden');
        document.getElementById('player-status-msg').innerHTML = "⏳ Čekejte na spuštění otázky pořadatelem...";
      }
    });
  }

  function selectOpt(btn, idx) {
    document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedOption = idx;
    document.getElementById('player-submit-btn').disabled = false;
  }

  function submitPlayerAnswer() {
    if (selectedOption === null || !myTeamKey) return;
    
    db.ref(`teams/${myTeamKey}/currentAnswer`).set(selectedOption).then(() => {
      document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
      document.getElementById('player-submit-btn').disabled = true;
      document.getElementById('player-submit-btn').innerText = "🔒 ODPOVĚĎ ZAMKNUTA A ODESLÁNA";
    }).catch(err => {
      alert("Chyba při odesílání odpovědi: " + err.message);
    });
  }

  function listenHost() {
    db.ref('teams').on('value', snapshot => {
      const teams = snapshot.val() || {};
      const teamKeys = Object.keys(teams);
      
      const renderTeamsHtml = teamKeys.map(k => {
        const t = teams[k];
        const playersStr = t.players && t.players.length > 0 ? ` (${t.players.join(', ')})` : '';
        return `<div class="team-item">
                  <div>🟢 <strong>${t.name}</strong>${playersStr}</div>
                  <button class="btn-kick" onclick="deleteTeam('${k}')">🗑️ Smazat</button>
                </div>`;
      }).join('');

      document.getElementById('connected-teams-list').innerHTML = renderTeamsHtml;
      document.getElementById('connected-teams-game-list').innerHTML = renderTeamsHtml;

      let voted = 0;
      teamKeys.forEach(k => { if (teams[k].currentAnswer !== undefined && teams[k].currentAnswer !== null) voted++; });
      document.getElementById('host-votes-count').innerText = `Odhlasováno: ${voted} / ${teamKeys.length}`;
    });
  }

  // ODSTRANĚNÍ / KICKNUTÍ TÝMU MODERÁTOREM
  function deleteTeam(teamKey) {
    if (confirm("Opravdu chcete tento tým odstranit?")) {
      db.ref(`teams/${teamKey}`).remove();
    }
  }

  function startNextQuestionHost() {
    currentQIndex++;
    if (currentQIndex >= questions.length) return alert("Konec kvízu! Všechny otázky byly odehrány.");

    db.ref('teams').once('value', snapshot => {
      const teams = snapshot.val() || {};
      Object.keys(teams).forEach(k => {
        db.ref(`teams/${k}/currentAnswer`).remove();
      });
    });

    db.ref('gameState').set({ status: 'QUESTION', qIndex: currentQIndex });

    document.getElementById('host-setup').classList.add('hidden');
    document.getElementById('host-game').classList.remove('hidden');
    document.getElementById('host-results-box').classList.add('hidden');

    const qData = questions[currentQIndex];
    document.getElementById('host-cat-num').innerText = `${qData.cat} | Otázka ${currentQIndex + 1} z ${questions.length}`;
    document.getElementById('host-q-text').innerText = qData.q;
  }

  function revealResultsHost() {
    const qData = questions[currentQIndex];

    db.ref('teams').once('value', snapshot => {
      const teams = snapshot.val() || {};
      Object.keys(teams).forEach(k => {
        if (teams[k].currentAnswer === qData.correct) {
          db.ref(`teams/${k}/score`).set((teams[k].score || 0) + 1);
        }
      });

      setTimeout(renderLeaderboard, 300);
    });

    db.ref('gameState/status').set('RESULTS');
    document.getElementById('host-results-box').classList.remove('hidden');
    document.getElementById('host-correct-ans').innerText = qData.opts[qData.correct];
  }

  function renderLeaderboard() {
    db.ref('teams').once('value', snapshot => {
      const teams = snapshot.val() || {};
      let sorted = Object.values(teams).sort((a,b) => b.score - a.score);
      
      document.getElementById('leaderboard-body').innerHTML = sorted.map((t, i) => `
        <tr>
          <td>#${i+1}</td>
          <td><strong>${t.name}</strong></td>
          <td>${t.score} b.</td>
        </tr>
      `).join('');
    });
  }
</script>
</body>
</html>
